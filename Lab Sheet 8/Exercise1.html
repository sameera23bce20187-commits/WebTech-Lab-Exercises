<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Marks Report</title>
  <link rel="stylesheet" href="Exercise1.css" />
</head>
<body>
  <h2>Student Marks Report</h2>

  <form id="studentForm">
    <label for="studentName">Student Name:</label>
    <input type="text" id="studentName" required />

    <label for="mark1">Mark 1:</label>
    <input type="number" id="mark1" required />

    <label for="mark2">Mark 2:</label>
    <input type="number" id="mark2" required />

    <label for="mark3">Mark 3:</label>
    <input type="number" id="mark3" required />

    <button type="submit">Calculate</button>
  </form>

  <div id="output"></div>

  <script src="Exercise1.js"></script>
</body>
</html>
